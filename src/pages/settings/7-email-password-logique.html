<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>ViewCoin – Email & mot de passe</title>
<style>
:root{--bg:#000;--card:rgba(120,120,120,0.14);--card-border:rgba(255,255,255,0.12);--accent:#1b4d2e;--accent-dot:#eafbf0;}
*{box-sizing:border-box}
body{background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:24px 16px;max-width:420px;margin:0 auto}
.icon{width:19px;height:19px;stroke:#d8d8d8;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.header{display:flex;align-items:center;gap:12px;padding:8px 4px 20px}
.header .icon{width:22px;height:22px;stroke:#eee}
.header span{font-size:17px;font-weight:500;color:#fff}
.group-label{font-size:12px;color:#999;padding:0 4px 8px;letter-spacing:.03em}
.group-card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:0.5px solid var(--card-border);border-radius:16px;overflow:hidden;margin-bottom:10px}
.field{padding:12px 16px;border-bottom:0.5px solid rgba(255,255,255,0.08)}
.field:last-child{border-bottom:none}
.field .label{font-size:11px;color:#9a9a9a;margin-bottom:4px}
.field .value{font-size:14px;color:#6f6f6f}
.field .value.filled{color:#c9c9c9}
.field input{width:100%;background:transparent;border:none;outline:none;color:#eee;font-size:14px}
.field input::placeholder{color:#6f6f6f}
.error{font-size:11px;color:#e08080;margin-top:12px;min-height:14px}
button.secondary{width:100%;background:var(--card);border:0.5px solid rgba(255,255,255,0.14);color:#eee;border-radius:14px;padding:12px;font-size:14px;font-weight:500;margin-bottom:28px;cursor:pointer}
button.primary{width:100%;background:var(--accent);color:var(--accent-dot);border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:500;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
.strength{display:flex;align-items:center;gap:8px;padding:2px 6px 20px}
.strength .bar{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,0.12)}
.strength .bar.filled{background:var(--accent)}
.strength span{font-size:11px;color:#9a9a9a;margin-left:4px}
.toast{text-align:center;font-size:12px;color:#3ddc84;margin-top:-16px;margin-bottom:16px;opacity:0;transition:opacity .3s;}
.toast.show{opacity:1;}
</style></head><body>

<div class="header"><svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>Email & mot de passe</span></div>

<div class="group-label">modifier l'email</div>
<div class="group-card">
  <div class="field"><div class="label">Email actuel</div><div class="value filled" id="current-email"></div></div>
  <div class="field"><div class="label">Nouvel email</div><input type="email" id="new-email" placeholder="exemple@email.com"></div>
</div>
<div class="error" id="email-error"></div>
<button class="secondary" id="update-email-btn">Mettre à jour l'email</button>
<div class="toast" id="email-toast">Email mis à jour</div>

<div class="group-label">modifier le mot de passe</div>
<div class="group-card">
  <div class="field"><div class="label">Mot de passe actuel</div><input type="password" id="current-password" placeholder="••••••••"></div>
  <div class="field"><div class="label">Nouveau mot de passe</div><input type="password" id="new-password" placeholder="••••••••"></div>
  <div class="field"><div class="label">Confirmer le nouveau mot de passe</div><input type="password" id="confirm-password" placeholder="••••••••"></div>
</div>

<div class="strength" id="strength-bar">
  <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  <span id="strength-label">—</span>
</div>
<div class="error" id="password-error"></div>

<button class="primary" id="update-password-btn">Mettre à jour le mot de passe</button>
<div class="toast" id="password-toast">Mot de passe mis à jour</div>

<script>
/* ============================================================
   BACKEND À BRANCHER :
   - #current-email : GET /api/users/me réel (jamais fixe).
   - "Mettre à jour l'email" : POST /api/users/me/email
     { newEmail } réel — la démo ci-dessous simule juste avec
     localStorage + une validation de format côté client.
   - "Mettre à jour le mot de passe" : POST /api/users/me/password
     { currentPassword, newPassword } réel, avec vérification
     du mot de passe actuel côté serveur (jamais côté client).
   - Le calcul de force du mot de passe ci-dessous est indicatif ;
     garder une vraie règle de sécurité côté serveur en plus.
   ============================================================ */

const USER_EMAIL = "ayoub.****@gmail.com"; // À remplacer par le vrai email du compte
document.getElementById('current-email').textContent = USER_EMAIL;

// --- Email ---
const newEmailInput = document.getElementById('new-email');
const emailError = document.getElementById('email-error');
document.getElementById('update-email-btn').addEventListener('click', () => {
  const val = newEmailInput.value.trim();
  const validFormat = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  if (!val) { emailError.textContent = "Entrez un nouvel email."; return; }
  if (!validFormat) { emailError.textContent = "Format d'email invalide."; return; }
  if (val === USER_EMAIL) { emailError.textContent = "C'est déjà votre email actuel."; return; }
  emailError.textContent = "";
  // TODO: POST /api/users/me/email { newEmail: val }
  const toast = document.getElementById('email-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
  newEmailInput.value = '';
});

// --- Mot de passe ---
const curPw = document.getElementById('current-password');
const newPw = document.getElementById('new-password');
const confPw = document.getElementById('confirm-password');
const pwError = document.getElementById('password-error');

function passwordStrength(pw){
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if (/[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
  return score; // 0 à 3
}

function updateStrengthUI(){
  const score = passwordStrength(newPw.value);
  const bars = document.querySelectorAll('#strength-bar .bar');
  const labels = ['Faible','Moyen','Fort'];
  bars.forEach((b, i) => b.classList.toggle('filled', i < score));
  document.getElementById('strength-label').textContent = newPw.value ? (labels[score-1] || 'Faible') : '—';
}
newPw.addEventListener('input', updateStrengthUI);

document.getElementById('update-password-btn').addEventListener('click', () => {
  if (!curPw.value) { pwError.textContent = "Entrez votre mot de passe actuel."; return; }
  if (newPw.value.length < 8) { pwError.textContent = "Le nouveau mot de passe doit faire au moins 8 caractères."; return; }
  if (newPw.value !== confPw.value) { pwError.textContent = "Les deux mots de passe ne correspondent pas."; return; }
  pwError.textContent = "";
  // TODO: POST /api/users/me/password { currentPassword: curPw.value, newPassword: newPw.value }
  // La vérification du mot de passe actuel doit se faire côté serveur.
  const toast = document.getElementById('password-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
  curPw.value = ''; newPw.value = ''; confPw.value = '';
  updateStrengthUI();
});
</script>
</body></html>
