<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>ViewCoin – Pays</title>
<style>
:root{--bg:#000;--card:rgba(120,120,120,0.14);--card-border:rgba(255,255,255,0.12);--accent-check:#3ddc84;}
*{box-sizing:border-box}
body{background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:24px 16px;max-width:420px;margin:0 auto}
.icon{width:19px;height:19px;stroke:#eee;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.header{display:flex;align-items:center;gap:12px;padding:8px 4px 18px}
.header span{font-size:17px;font-weight:500;color:#fff}
.search{display:flex;align-items:center;gap:10px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:0.5px solid var(--card-border);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.search svg{stroke:#9a9a9a;width:17px;height:17px}
.search input{background:transparent;border:none;outline:none;color:#fff;font-size:14px;width:100%}
.search input::placeholder{color:#8f8f8f}
.group-label{font-size:12px;color:#999;padding:0 4px 8px;letter-spacing:.03em}
.current{display:flex;align-items:center;justify-content:space-between;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:0.5px solid rgba(27,77,46,0.5);border-radius:16px;padding:14px 16px;margin-bottom:20px}
.current .left{display:flex;align-items:center;gap:12px}
.current .flag{font-size:20px}
.current .name{font-size:14px;color:#fff}
.current svg{stroke:var(--accent-check);width:18px;height:18px}
.list-card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:0.5px solid var(--card-border);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:0.5px solid rgba(255,255,255,0.08);cursor:pointer}
.row:last-child{border-bottom:none}
.row .left{display:flex;align-items:center;gap:12px}
.row .flag{font-size:20px}
.row .name{font-size:14px;color:#eee}
.row svg{stroke:var(--accent-check);width:16px;height:16px;visibility:hidden}
.row.selected svg{visibility:visible}
</style></head><body>

<div class="header"><svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>Pays</span></div>

<div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input type="text" placeholder="Rechercher un pays" id="search-input">
</div>

<div class="group-label">pays actuel</div>
<div class="current" id="current-country"></div>

<div class="group-label">tous les pays</div>
<div class="list-card" id="country-list"></div>

<script>
/* ============================================================
   BACKEND À BRANCHER :
   - Remplacer STORAGE_KEY / localStorage par le vrai profil
     utilisateur (ex: PUT /api/users/me { country: 'FR' }).
   - Le comportement (sélection, mise à jour immédiate,
     persistance) est déjà réel via localStorage.
   ============================================================ */

const STORAGE_KEY = 'viewcoin_user_country';

// Liste de démonstration — À REMPLACER par la liste complète des pays (ISO 3166)
const countries = [
  { code:"FR", flag: "🇫🇷", name: "France" },
  { code:"BE", flag: "🇧🇪", name: "Belgique" },
  { code:"CH", flag: "🇨🇭", name: "Suisse" },
  { code:"CA", flag: "🇨🇦", name: "Canada" },
  { code:"MA", flag: "🇲🇦", name: "Maroc" },
  { code:"DZ", flag: "🇩🇿", name: "Algérie" },
  { code:"TN", flag: "🇹🇳", name: "Tunisie" },
  { code:"SN", flag: "🇸🇳", name: "Sénégal" },
  { code:"CI", flag: "🇨🇮", name: "Côte d'Ivoire" },
  { code:"GB", flag: "🇬🇧", name: "Royaume-Uni" },
  { code:"US", flag: "🇺🇸", name: "États-Unis" },
];

function getCurrentCode(){ return localStorage.getItem(STORAGE_KEY) || "FR"; }
function setCurrentCode(code){
  localStorage.setItem(STORAGE_KEY, code);
  renderCurrent();
  renderList(document.getElementById('search-input').value);
}

function renderCurrent(){
  const c = countries.find(x => x.code === getCurrentCode()) || countries[0];
  document.getElementById('current-country').innerHTML = `
    <div class="left"><span class="flag">${c.flag}</span><span class="name">${c.name}</span></div>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
  `;
}

function renderList(filter=''){
  const list = document.getElementById('country-list');
  list.innerHTML = '';
  const q = filter.toLowerCase();
  countries.filter(c => c.name.toLowerCase().includes(q)).forEach(c => {
    const row = document.createElement('div');
    row.className = 'row' + (c.code === getCurrentCode() ? ' selected' : '');
    row.innerHTML = `
      <div class="left"><span class="flag">${c.flag}</span><span class="name">${c.name}</span></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
    `;
    row.addEventListener('click', () => setCurrentCode(c.code));
    list.appendChild(row);
  });
}

document.getElementById('search-input').addEventListener('input', e => renderList(e.target.value));

renderCurrent();
renderList();
</script>
</body></html>
