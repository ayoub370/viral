<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Viral – Welcome</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f2ee;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
#screen{max-width:420px;margin:0 auto;position:relative;height:100vh;overflow:hidden;background:#f3f2ee;}

.logo{position:absolute;top:20px;left:20px;z-index:5;font-size:22px;font-weight:900;letter-spacing:-0.01em;display:flex;}
.logo span{background:linear-gradient(160deg,#c9c9c9,#4a4a4a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.logo .rest{font-weight:500;}

/* Cartes droites (pas de rotation), remontées près du logo, superposées :
   celle du milieu au premier plan, les 2 côtés partiellement cachés derrière. */
.cards-zone{position:relative;height:280px;margin-top:60px;}
.card{position:absolute;top:0;left:50%;width:118px;height:190px;border-radius:20px;overflow:hidden;pointer-events:none;}
.card img{width:100%;height:100%;object-fit:cover;display:block;}
.card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,0.6) 100%);}
.card-tag{position:absolute;top:8px;left:8px;font-size:9px;font-weight:700;border-radius:5px;padding:2px 6px;}
.card-caption{position:absolute;bottom:8px;left:8px;right:8px;font-size:10px;color:#fff;font-weight:600;}

.card-filter{top:18px;transform:translateX(calc(-50% - 82px)) rotate(-10deg);transform-origin:bottom center;z-index:1;box-shadow:0 10px 20px rgba(0,0,0,0.15);}
.card-feed{transform:translateX(-50%);z-index:2;box-shadow:0 14px 28px rgba(0,0,0,0.22);}
.card-live{top:18px;transform:translateX(calc(-50% + 82px)) rotate(10deg);transform-origin:bottom center;z-index:1;box-shadow:0 10px 20px rgba(0,0,0,0.15);}

.sheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:32px 32px 0 0;padding:28px 24px 24px;box-shadow:0 -8px 24px rgba(0,0,0,0.06);z-index:3;}
.title{text-align:center;font-size:24px;font-weight:700;color:#111;}
.title b{font-weight:800;}
.slogan{text-align:center;font-size:13px;color:#8a8a8a;margin-top:6px;margin-bottom:22px;}

.oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #e5e5e5;border-radius:26px;padding:12px;margin-bottom:10px;font-size:14px;color:#222;font-weight:500;background:#fff;cursor:pointer;width:100%;}
.divider{display:flex;align-items:center;gap:10px;margin:6px 0 16px;}
.divider .line{flex:1;height:1px;background:#e5e5e5;}
.divider span{font-size:12px;color:#aaa;}
.create-btn{background:#111;color:#fff;text-align:center;border-radius:26px;padding:13px;font-size:14px;font-weight:600;margin-bottom:14px;border:none;width:100%;cursor:pointer;}
.login-line{text-align:center;font-size:13px;color:#777;}
.login-line b{color:#111;cursor:pointer;}
</style></head><body>
